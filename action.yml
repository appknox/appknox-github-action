name: 'Appknox GitHub action'
description: 'Ensure your mobile application are secure'
author: 'Appknox'
inputs:
  appknox_access_token:
    description: 'Pesonal Access token on Appknox'
    required: true
  file_path:
    description: 'Path to the mobile application binary (apk/ipa)'
    required: true
  risk_threshold:
    description: 'Minimum risk to fail CI. Valid options are LOW, MEDIUM, HIGH, CRITICAL. Mutually exclusive with health_score. Exactly one must be provided.'
    required: false
  sarif:
    description: 'Enable SARIF format report. Defaults to false'
    default: 'Disable'
  sast_timeout:
    description: 'Static scan timeout duration in minutes. If not provided defaults to 30 mins'
    required: false
    default: 30
  health_score:
    description: 'Minimum health score (0-100) to pass CI. Mutually exclusive with risk_threshold. Exactly one must be provided.'
    required: false
  trigger_knoxiq:
    description: 'Request KnoxIQ triage during upload. Defaults to false'
    required: false
    default: 'false'
  generate_pdf_report:
    description: 'Download the password-protected PDF report after the CI check. Defaults to false'
    required: false
    default: 'false'
outputs:
  pdf_report_path:
    description: 'Absolute path to the downloaded PDF report when generation succeeds'
  pdf_report_password_path:
    description: 'Absolute path to the downloaded PDF report password file when generation succeeds'
branding:
  icon: 'shield'
  color: 'blue'
runs:
  using: 'node16'
  main: 'dist/index.js'
